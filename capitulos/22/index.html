<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframes</title>
    <style>
        iframe{
            width: 95vh;
            height: 400px;
            border: 2px solid black;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de Iframe</h1>
    <p>Acessando o site do curso em video para aprender a programar. É possivel utilizar o Iframe para colocar uma pagina de outro site no seu site.
        <iframe src="https://www.fasapecas.com/pt" frameborder="0"></iframe>
    </p>
    <h1>Prévia utilizando Iframe</h1>
    <ol>
        <li> <a href="https://www.fasapecas.com/pt" target="frame">Fasa</a></li>
        <li><a href="https://autopecascomando.com.br/" target="frame">Comando</a></li>
    </ol>
    <iframe src="" frameborder="0" name="frame"></iframe>
    <hr>
    <br>
    <iframe src="02.html" frameborder="0" sandbox="sandbox">Seu navegador não é compativel</iframe>
</body>
</html>
